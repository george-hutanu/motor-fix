<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>body{margin:0;padding:16px;font:16px/1.5 system-ui,sans-serif} button{font-size:16px;padding:0 8px}</style></head><body>
<button id="cut" style="width:80px;white-space:nowrap;overflow:hidden">Programează o vizită</button>
<button id="spill" style="width:60px;white-space:nowrap">Programează acum</button>
