<section class="map" [attr.aria-label]="'public.results.map.label' | t">
  <div #host class="canvas" inert aria-hidden="true"></div>
  @if (!view() || loading()) {
    <div class="placeholder" aria-hidden="true"></div>
  }
  <ul class="legend">
    <li><span class="dot takes" aria-hidden="true"></span>{{ 'public.results.map.takes' | t: { brand: brand() } }}</li>
    <li><span class="dot refuses" aria-hidden="true"></span>{{ 'public.results.map.refuses' | t }}</li>
    <li>{{ 'public.results.map.rate' | t }}</li>
    @if (hasArea()) {
      <li><span class="dot area" aria-hidden="true"></span>{{ 'public.results.map.mobile' | t }}</li>
    }
  </ul>
</section>
