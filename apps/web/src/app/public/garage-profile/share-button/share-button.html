<button
  type="button"
  class="share"
  [attr.aria-label]="'public.garageProfile.shareName' | t: { name: name() }"
  (click)="share()"
>
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3" /><path d="M7 8l5-5 5 5" /><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" /></svg>
  {{ 'public.garageProfile.share' | t }}
</button>
@if (manual()) {
  <label [for]="fieldId">
    {{ 'public.garageProfile.shareCopyBelow' | t }}
    <input #field readonly type="text" [id]="fieldId" [value]="address()" />
  </label>
}
