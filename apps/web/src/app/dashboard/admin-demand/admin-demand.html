@if (!overview()) {
  <p class="subtitle">{{ 'admin.demand.subtitle' | t }}</p>
}
<div class="reports">
  @for (report of reports(); track report.kind) {
    <mf-bar-chart
      horizontal
      unit="count"
      [title]="report.title"
      [points]="report.points"
      [loading]="loading()"
      [error]="failed()"
      [empty]="empty()"
      (retry)="read()"
    >
      @if (report.all.length) {
        <button
          hlmBtn
          variant="ghost"
          type="button"
          [attr.aria-controls]="report.listId"
          [attr.aria-expanded]="expanded().has(report.kind)"
          (click)="toggle(report.kind)"
        >
          {{ expanded().has(report.kind) ? ('admin.demand.fewer' | t) : report.more }}
        </button>
        <ol class="all" [id]="report.listId" [hidden]="!expanded().has(report.kind)">
          @if (expanded().has(report.kind)) {
            @for (row of report.all; track $index) {
              <li><span class="name">{{ row.label }}</span><span class="count">{{ row.count }}</span></li>
            }
          }
        </ol>
      }
    </mf-bar-chart>
  }
</div>
