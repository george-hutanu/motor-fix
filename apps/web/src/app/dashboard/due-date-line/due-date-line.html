@let now = status();
@if (addable() && now.days === null) {
  <button type="button" (click)="add.emit()"><mf-lamp [state]="now.state" [label]="sentence(now)" /></button>
} @else {
  <mf-lamp [state]="now.state" [label]="sentence(now)" />
}
@if (now.passed && link(); as to) {
  <a
    [routerLink]="to.path"
    [queryParams]="to.query"
    [attr.aria-label]="to.name ? (to.name | t: to.params) : null"
  >{{ to.label | t }}</a>
}
