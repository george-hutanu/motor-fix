<p class="subject">{{ subject }}</p>
<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <fieldset class="reasons" [disabled]="sending()" [attr.aria-label]="'garage.requests.decline.reasons' | t">
    @for (reason of reasons(); track reason.code) {
      <label class="reason">
        <input type="radio" name="reason" formControlName="reason" [value]="reason.code" />
        <span>{{ reason.label }}</span>
      </label>
    }
  </fieldset>
  <mf-task-error [save]="save" />
  @if (!online()) {
    <p class="error" role="status">{{ 'garage.requests.decline.offline' | t }}</p>
  }
  <div class="actions">
    <button hlmBtn variant="secondary" type="button" [disabled]="sending()" (click)="task.close('cancelled')">{{ 'garage.requests.decline.cancel' | t }}</button>
    <button hlmBtn type="submit" [mfTaskSubmit]="save" [disabled]="blocked()">{{ 'garage.requests.decline.submit' | t }}</button>
  </div>
</form>
