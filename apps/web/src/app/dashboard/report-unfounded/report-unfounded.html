<form (submit)="confirm($event)" novalidate>
  <p>{{ 'admin.file.reportDecision.unfoundedQuestion' | t }}</p>
  <div class="field">
    <label for="mf-report-note">{{ 'admin.file.reportDecision.note' | t }}</label>
    <textarea
      hlmInput
      id="mf-report-note"
      rows="3"
      [value]="note()"
      [attr.aria-invalid]="tooLong() ? 'true' : null"
      [attr.aria-describedby]="tooLong() ? 'mf-report-note-count mf-report-note-error' : 'mf-report-note-count'"
      (input)="input($event)"
    ></textarea>
    <p class="count" id="mf-report-note-count">{{ 'admin.file.reportDecision.noteCount' | t: { n: count() } }}</p>
    @if (tooLong()) {
      <p class="error" id="mf-report-note-error" role="alert">{{ 'admin.file.reportDecision.noteTooLong' | t }}</p>
    }
  </div>
  <div class="actions">
    <button hlmBtn variant="secondary" type="button" (click)="task.close('cancelled')">{{ 'admin.file.reportDecision.cancel' | t }}</button>
    <button hlmBtn type="submit">{{ 'admin.file.reportDecision.unfounded' | t }}</button>
  </div>
</form>
