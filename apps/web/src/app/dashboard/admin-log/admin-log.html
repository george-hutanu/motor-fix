<section [attr.aria-labelledby]="headingId">
  <h2 [id]="headingId">{{ 'admin.log.title' | t }}</h2>
  @if (!view || view.isLoading()) {
    <div class="loading" aria-hidden="true">
      <span class="skeleton"></span>
      <span class="skeleton"></span>
      <span class="skeleton"></span>
    </div>
  } @else if (view.error() && !view.value()) {
    <div class="failed">
      <p role="alert">{{ 'admin.log.failed' | t }}</p>
      <button hlmBtn variant="secondary" type="button" (click)="view.reload()">{{ 'admin.log.retry' | t }}</button>
    </div>
  } @else if (lines().length === 0) {
    <p class="empty">{{ 'admin.log.empty' | t }}</p>
  } @else {
    <mf-log-lines [lines]="lines()" />
  }
  <a class="all" routerLink="/app/admin/log">{{ 'admin.log.all' | t }}</a>
</section>
