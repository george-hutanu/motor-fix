<form (submit)="confirm($event)" novalidate>
  @if (!confirmed) {
    <p>{{ 'admin.file.reportDecision.unfoundedQuestion' | t }}</p>
  }
  <div class="field">
    <label for="mf-report-text">{{ keys.label | t }}</label>
    <textarea
      hlmInput
      id="mf-report-text"
      rows="3"
      [required]="confirmed"
      [value]="text()"
      [attr.aria-invalid]="tooLong() ? 'true' : null"
      [attr.aria-describedby]="tooLong() ? 'mf-report-text-count mf-report-text-error' : 'mf-report-text-count'"
      (input)="input($event)"
    ></textarea>
    <p class="count" id="mf-report-text-count">{{ keys.count | t: { n: count() } }}</p>
    @if (tooLong()) {
      <p class="error" id="mf-report-text-error" role="alert">{{ keys.tooLong | t }}</p>
    }
  </div>
  @if (confirmed) {
    <p class="suspends">{{ 'admin.file.reportDecision.suspends' | t }}</p>
  }
  <div class="actions">
    <button hlmBtn variant="secondary" type="button" (click)="task.close('cancelled')">{{ 'admin.file.reportDecision.cancel' | t }}</button>
    <button hlmBtn type="submit" [disabled]="blank()">{{ keys.submit | t }}</button>
  </div>
</form>
