<form (submit)="confirm($event)" novalidate>
  <div class="field">
    <label for="mf-report-reason">{{ 'admin.file.reportDecision.reason' | t }}</label>
    <textarea
      hlmInput
      id="mf-report-reason"
      rows="3"
      required
      [value]="reason()"
      [attr.aria-invalid]="tooLong() ? 'true' : null"
      [attr.aria-describedby]="tooLong() ? 'mf-report-reason-count mf-report-reason-error' : 'mf-report-reason-count'"
      (input)="input($event)"
    ></textarea>
    <p class="count" id="mf-report-reason-count">{{ 'admin.file.reportDecision.reasonCount' | t: { n: count() } }}</p>
    @if (tooLong()) {
      <p class="error" id="mf-report-reason-error" role="alert">{{ 'admin.file.reportDecision.reasonTooLong' | t }}</p>
    }
  </div>
  <p class="suspends">{{ 'admin.file.reportDecision.suspends' | t }}</p>
  <div class="actions">
    <button hlmBtn variant="secondary" type="button" (click)="task.close('cancelled')">{{ 'admin.file.reportDecision.cancel' | t }}</button>
    <button hlmBtn type="submit" [disabled]="blank()">{{ 'admin.file.reportDecision.confirmedSubmit' | t }}</button>
  </div>
</form>
