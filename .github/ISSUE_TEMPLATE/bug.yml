name: Bug
description: Something that works differently from how it should.
labels: ["type: bug"]
projects: ["george-hutanu/11"]
body:
  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: What you saw, where, and on which device.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: How to make it happen again.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
