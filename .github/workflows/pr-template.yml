name: PR template

# Every PR fills in .github/pull_request_template.md (AGENTS.md). A draft only
# needs the headings; marking it ready re-runs the full check.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-template-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  body:
    # Dependabot writes its own body.
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
            scripts
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Check the PR title and body against the template
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: node scripts/pr-body-check.ts
