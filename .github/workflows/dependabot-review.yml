# The agent-review a Dependabot-only PR gets without a PR tester run (961-FR-001).
#
# GitHub requires agent-review on main (branch protection, AGENTS.md step 7),
# and a PR Dependabot opened and alone committed to skips the tester (step 6).
# This writes its success after the gates' own rule (lib/dependabot.mjs).
#
# pull_request_target runs the base branch's copy of this file and of the
# script, with a token that can write a status; the job never checks out or
# runs the PR's code, so a PR cannot decide its own status. A head that already
# has an agent-review of any state is left as it is. workflow_dispatch covers a
# Dependabot PR opened before this file was on main.
name: Dependabot review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: Dependabot PR number
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The default branch's scripts only: no PR ref, no install.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .claude/scripts
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Post agent-review for a Dependabot-only PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr || github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .claude/scripts/pr-test/dependabot-review.mjs "$PR"
