name: CI

# Pull requests run the affected projects, and a documentation-only PR runs
# only the change detector and CI OK; merges into main run every project
# through release.yml. The PR title has its own workflow (pr-title.yml), so an
# edited title is re-checked without re-running these jobs. Mutation testing
# has its own workflow (mutation.yml) and never runs here.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# A new push to a PR cancels its older run; runs on main never cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NX_SCOPE: ${{ github.event_name == 'pull_request' && format('affected --base=origin/{0}', github.base_ref) || 'run-many' }}
  TZ: UTC

jobs:
  # Decides whether the PR changes documentation only (scripts/docs-only.ts).
  # Off a PR the step does not run, the output is empty and every job runs.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        if: github.event_name == 'pull_request'
        with:
          node-version-file: .nvmrc
      - id: classify
        if: github.event_name == 'pull_request'
        run: node scripts/docs-only.ts origin/${{ github.base_ref }}

  # The checks that need no database share one runner and one install: on the
  # free plan every job holds one of the account's 20 concurrent runners, so
  # fewer jobs queue less. Each step runs even when an earlier one failed, so
  # one red run names every failing check.
  checks:
    name: Checks
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Biome
        if: ${{ !cancelled() }}
        run: npx biome ci
      - name: Dependency audit
        if: ${{ !cancelled() }}
        # npm ci installs the lockfile as is; the dry run re-resolves
        # package.json, so a peer conflict the lockfile hides (ERESOLVE) fails here.
        run: |
          npm audit --omit=dev --audit-level=high
          npm install --dry-run --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npx nx $NX_SCOPE -t typecheck
      - name: Build
        if: ${{ !cancelled() }}
        run: npx nx $NX_SCOPE -t build
      - name: Contract check
        if: ${{ !cancelled() }}
        run: sh scripts/contract-check.sh
      - name: Observability inventory
        if: ${{ !cancelled() }}
        run: node scripts/observability-inventory.ts
      # On a PR the baseline may hold no entry the base branch's baseline lacks.
      - name: Structure
        if: ${{ !cancelled() }}
        run: node scripts/structure-check.ts ${{ github.event_name == 'pull_request' && format('--base origin/{0}', github.base_ref) || '' }}
      # The PR tester's layout and sweep specs measure fixture pages in a real
      # browser and fail in CI without one. The headless shell is enough, and
      # the runner image already carries Chrome's system libraries.
      - id: harness-playwright
        if: ${{ !cancelled() }}
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: harness-browser
        if: ${{ !cancelled() }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ steps.harness-playwright.outputs.version }}
      - name: Browser for the harness
        if: ${{ !cancelled() && steps.harness-browser.outputs.cache-hit != 'true' }}
        timeout-minutes: 10
        # Bounded and retried like every Playwright install; no apt runs here, so nothing to repair.
        run: |
          for attempt in 1 2 3; do
            timeout -k 10 180 npx playwright install --only-shell chromium && exit 0
            echo "::warning::playwright install --only-shell chromium: attempt $attempt of 3 failed or timed out"
          done
          exit 1
      - name: Harness
        if: ${{ !cancelled() }}
        run: |
          npm run lint:harness
          npm run test:harness
      # The local stack (docker-compose.yml) the PR tester boots: every image
      # still pulls, the services come up healthy and the one-shot setup creates
      # the bucket. The setup stays out of --wait, which fails when it exits
      # before compose sees it running; run returns its exit code. On main,
      # release.yml calls this workflow and the stack is not checked.
      - name: Compose stack
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          docker compose up -d --wait postgres redis minio
          docker compose run --rm minio-setup
          docker compose run --rm --entrypoint sh minio-setup -c \
            "mc alias set local http://minio:9000 motorfix motorfix-secret && mc ls local/motorfix"
          docker compose --profile observability up -d otel-lgtm
          for i in $(seq 60); do curl -fsS localhost:3300/api/health && break; sleep 2; done
          curl -fsS localhost:3300/api/health
          for i in $(seq 30); do
            curl -fsS -X POST -H 'content-type: application/json' -d '{"resourceLogs":[]}' localhost:4318/v1/logs && break
            sleep 2
          done
          curl -fsS -X POST -H 'content-type: application/json' -d '{"resourceLogs":[]}' localhost:4318/v1/logs
      - name: Stop the compose stack
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: docker compose --profile observability down -v --remove-orphans

  tests:
    name: Unit and integration tests
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services: &services
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
      AUTH_TOKEN_SECRET: ci-only-test-secret-not-used-in-any-deploy
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # JEST_SUITE is an input of the test target (nx.json), so the two runs
      # never answer each other from the Nx cache.
      - name: Unit tests
        if: ${{ !cancelled() }}
        env:
          JEST_SUITE: unit
        run: npx nx $NX_SCOPE -t test --passWithNoTests
      # Service containers take no command, so the slow-statement view is
      # preloaded here: the data-store specs read it, never skip it.
      - name: Preload pg_stat_statements
        if: ${{ !cancelled() }}
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -c "ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements'"
          docker restart ${{ job.services.postgres.id }}
          for i in $(seq 1 30); do
            docker exec ${{ job.services.postgres.id }} pg_isready -U postgres && break
            sleep 1
          done
          docker exec ${{ job.services.postgres.id }} pg_isready -U postgres
      - name: Migrate the test database
        if: ${{ !cancelled() }}
        run: npx prisma migrate deploy --config libs/domain/prisma.config.ts
      - name: Integration tests
        if: ${{ !cancelled() }}
        env:
          JEST_SUITE: integration
        run: npx nx $NX_SCOPE -t test --passWithNoTests

  e2e:
    name: E2E tests
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services: *services
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
      AUTH_TOKEN_SECRET: ci-only-test-secret-not-used-in-any-deploy
      # The api writes the e-mail confirmation link with it.
      PUBLIC_WEB_URL: http://localhost:4200
      # The api and the worker send e-mail to the test mailbox (apps/web-e2e/mailbox.mjs,
      # web-e2e:mailbox), never to Brevo; the password-reset flow reads the link from it.
      EMAIL_SENDING: 'on'
      EMAIL_ALLOWLIST: '@example.test'
      EMAIL_FROM: 'MotorFix <noreply@example.test>'
      BREVO_API_KEY: e2e-mailbox-key
      BREVO_API_URL: http://127.0.0.1:3025/v3
      # The api sends sign-in codes by WhatsApp to the same mailbox, which
      # keeps them for the phone sign-in flow to read.
      PHONE_SENDING: 'on'
      PHONE_ALLOWLIST: '+4070000*'
      WHATSAPP_SENDER: '+40700000000'
      WHATSAPP_TEMPLATES: 'motorfix_sign_in_code_ro=1,motorfix_sign_in_code_en=2'
      # Sign-in with Google goes to the stand-in issuer (apps/web-e2e/openid.mjs,
      # web-e2e:openid), never the real Google; these are not real keys.
      GOOGLE_CLIENT_ID: e2e-client
      GOOGLE_CLIENT_SECRET: e2e-only-not-a-secret
      GOOGLE_ISSUER: http://127.0.0.1:3026
      # Pages carry the browser telemetry tag; the tests answer the
      # collector themselves (apps/web-e2e/src/fixtures.ts), so nothing leaves.
      FARO_URL: https://faro.invalid/collect/e2e
      # The photo flows upload to the compose MinIO, started in the steps below.
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_REGION: eu-central-1
      STORAGE_BUCKET: motorfix
      STORAGE_ACCESS_KEY_ID: motorfix
      STORAGE_SECRET_ACCESS_KEY: motorfix-secret
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Object storage
        run: |
          docker compose up -d --wait minio
          docker compose run --rm minio-setup
      - name: Migrate the test database
        run: npx prisma migrate deploy --config libs/domain/prisma.config.ts
      # The sign-in flows use the seeded accounts.
      - name: Seed the test accounts
        run: npx nx run domain:seed
      - id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        timeout-minutes: 10
        # apt hangs at random: 180 s an attempt, three attempts. apt runs under sudo, out of
        # timeout's reach, so a failed attempt kills it as root and repairs dpkg before the next.
        run: |
          for attempt in 1 2 3; do
            timeout -k 10 180 npx playwright install --with-deps chromium && exit 0
            echo "::warning::playwright install --with-deps chromium: attempt $attempt of 3 failed or timed out"
            sudo sh -c 'pkill -9 -x apt-get; pkill -9 -x dpkg; dpkg --configure -a' || true
          done
          exit 1
      - if: steps.browsers.outputs.cache-hit == 'true'
        timeout-minutes: 10
        # apt hangs at random: 180 s an attempt, three attempts. apt runs under sudo, out of
        # timeout's reach, so a failed attempt kills it as root and repairs dpkg before the next.
        run: |
          for attempt in 1 2 3; do
            timeout -k 10 180 npx playwright install-deps chromium && exit 0
            echo "::warning::playwright install-deps chromium: attempt $attempt of 3 failed or timed out"
            sudo sh -c 'pkill -9 -x apt-get; pkill -9 -x dpkg; dpkg --configure -a' || true
          done
          exit 1
      # Playwright starts the api, the worker and the web dev server itself (playwright.config.mts).
      - run: npx nx $NX_SCOPE -t e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            dist/.playwright
            apps/web-e2e/test-output
          if-no-files-found: ignore
          # The report sits under dist/.playwright, a dot directory upload-artifact skips by default.
          include-hidden-files: true

  # On main, release.yml's images job is the real build.
  docker:
    name: Docker build (${{ matrix.app }})
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            target: web
          # worker and mcp build the same node-app stage with another APP.
          - app: api
            target: node-app
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: APP=${{ matrix.app }}
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, checks, tests, e2e, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job passed or did not apply
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
