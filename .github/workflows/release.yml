name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  # Merges in quick succession queue their checks instead of each holding
  # five runners of the free plan's 20 at once. A waiting run is replaced by
  # a newer one (its own images and staging then skip); a running one finishes.
  checks:
    concurrency:
      group: release-checks
      cancel-in-progress: false
    uses: ./.github/workflows/ci.yml

  images:
    needs: checks
    runs-on: ubuntu-latest
    env:
      # Only whether the key is set; the key itself reaches the upload step
      # alone.
      FARO_SOURCEMAPS: ${{ secrets.FARO_SOURCEMAP_API_KEY != '' }}
    outputs:
      web: ${{ steps.web.outputs.digest }}
      api: ${{ steps.api.outputs.digest }}
      worker: ${{ steps.worker.outputs.digest }}
      mcp: ${{ steps.mcp.outputs.digest }}
    # web and api write the layer cache PRs read (a PR can only read caches
    # written on main); worker and mcp build the api's node-app stage, so they
    # read its scope and write none.
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: web
        uses: docker/build-push-action@v7
        with:
          build-args: |
            APP=web
            RELEASE_SHA=${{ github.sha }}
          target: web
          push: true
          tags: ghcr.io/${{ github.repository }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      # The web build's source maps, from the layers just built, go to the
      # error collector so browser stacks read as source; skipped until the
      # owner sets the secret.
      - name: Skip the web source maps
        if: env.FARO_SOURCEMAPS != 'true'
        run: echo "::notice::FARO_SOURCEMAP_API_KEY is not set; the web source maps are not uploaded for this release."
      - name: Export the web source maps
        if: env.FARO_SOURCEMAPS == 'true'
        uses: docker/build-push-action@v7
        with:
          build-args: |
            APP=web
            RELEASE_SHA=${{ github.sha }}
          target: web-maps
          outputs: type=local,dest=./web-maps
          cache-from: type=gha,scope=web
      - name: Upload the web source maps
        if: env.FARO_SOURCEMAPS == 'true'
        env:
          FARO_SOURCEMAP_API_KEY: ${{ secrets.FARO_SOURCEMAP_API_KEY }}
          FARO_SOURCEMAP_ENDPOINT: ${{ vars.FARO_SOURCEMAP_ENDPOINT }}
          FARO_SOURCEMAP_APP_ID: ${{ vars.FARO_SOURCEMAP_APP_ID }}
          FARO_SOURCEMAP_STACK_ID: ${{ vars.FARO_SOURCEMAP_STACK_ID }}
        # faro-cli runs at a pinned version outside the lockfile (this job
        # installs nothing else); its own dependencies are not pinned.
        run: |
          npx -y @grafana/faro-cli@0.13.1 upload \
            --endpoint "$FARO_SOURCEMAP_ENDPOINT" \
            --app-id "$FARO_SOURCEMAP_APP_ID" \
            --stack-id "$FARO_SOURCEMAP_STACK_ID" \
            --api-key "$FARO_SOURCEMAP_API_KEY" \
            --bundle-id "${{ github.sha }}" \
            --output-path ./web-maps \
            --gzip-payload
      - id: api
        uses: docker/build-push-action@v7
        with:
          build-args: |
            APP=api
            RELEASE_SHA=${{ github.sha }}
          target: node-app
          push: true
          tags: ghcr.io/${{ github.repository }}-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - id: worker
        uses: docker/build-push-action@v7
        with:
          build-args: |
            APP=worker
            RELEASE_SHA=${{ github.sha }}
          target: node-app
          push: true
          tags: ghcr.io/${{ github.repository }}-worker:${{ github.sha }}
          cache-from: type=gha,scope=api
      - id: mcp
        uses: docker/build-push-action@v7
        with:
          build-args: |
            APP=mcp
            RELEASE_SHA=${{ github.sha }}
          target: node-app
          push: true
          tags: ghcr.io/${{ github.repository }}-mcp:${{ github.sha }}
          cache-from: type=gha,scope=api

  staging:
    needs: images
    runs-on: ubuntu-latest
    environment: staging
    # Staging releases run one at a time, in commit order.
    concurrency:
      group: release-staging
      cancel-in-progress: false
    env:
      IMAGE_WEB: ghcr.io/${{ github.repository }}-web@${{ needs.images.outputs.web }}
      IMAGE_API: ghcr.io/${{ github.repository }}-api@${{ needs.images.outputs.api }}
      IMAGE_WORKER: ghcr.io/${{ github.repository }}-worker@${{ needs.images.outputs.worker }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_SERVICE_WEB: ${{ vars.RAILWAY_SERVICE_WEB }}
      RAILWAY_SERVICE_API: ${{ vars.RAILWAY_SERVICE_API }}
      RAILWAY_SERVICE_WORKER: ${{ vars.RAILWAY_SERVICE_WORKER }}
      RAILWAY_PROJECT_ID: 8dd6e2d9-ee17-4935-b160-9282308d5ac7
      KEY_NAME: release-staging-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Deploy and wait for /health/ready
        # exec: the runner's cancel signals reach node, not a waiting shell.
        run: exec node scripts/railway-deploy.ts staging
      # The end-to-end run signs in as the seed accounts, and only a reset used
      # to seed staging, so an account added since the last one was missing.
      # The seed only adds what is missing. Staging's Postgres has no public
      # address: the seed runs inside the api over `railway ssh`, as in
      # reset-staging.yml, whose script it shares.
      - name: Install the Railway CLI
        run: npm install --global @railway/cli@5.63.1
      - name: Register an SSH key for this run
        run: |
          mkdir -p -m 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -C "$KEY_NAME" -f ~/.ssh/id_ed25519
          railway ssh keys add --key ~/.ssh/id_ed25519.pub --name "$KEY_NAME"
          printf 'Host ssh.railway.com\n  StrictHostKeyChecking accept-new\n' >> ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Seed staging inside the api
        env:
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
        # The password travels on stdin, base64 and masked, never as an argument.
        run: |
          if [ -z "$SEED_PASSWORD" ]; then
            echo 'The staging environment has no SEED_PASSWORD secret.' >&2
            exit 1
          fi
          encoded=$(printf %s "$SEED_PASSWORD" | base64 -w0)
          echo "::add-mask::$encoded"
          {
            printf 'SEED_PASSWORD=$(printf %%s %s | base64 -d)\n' "$encoded"
            printf 'export SEED_PASSWORD\n'
            printf 'export SEED_ONLY=1\n'
            cat scripts/reset-staging.sh
          } | railway ssh --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --service "$RAILWAY_SERVICE_API" -- sh -s
      - name: Remove the SSH key
        if: always()
        run: |
          [ -f ~/.ssh/id_ed25519.pub ] || exit 0
          railway ssh keys remove "$KEY_NAME"
      - run: npm ci
      - timeout-minutes: 10
        # apt hangs at random: 180 s an attempt, three attempts. apt runs under sudo, out of
        # timeout's reach, so a failed attempt kills it as root and repairs dpkg before the next.
        run: |
          for attempt in 1 2 3; do
            timeout -k 10 180 npx playwright install --with-deps chromium && exit 0
            echo "::warning::playwright install --with-deps chromium: attempt $attempt of 3 failed or timed out"
            sudo sh -c 'pkill -9 -x apt-get; pkill -9 -x dpkg; dpkg --configure -a' || true
          done
          exit 1
      - name: End to end on staging
        run: npx nx run web-e2e:e2e --skip-nx-cache
        env:
          BASE_URL: ${{ vars.PUBLIC_WEB_URL }}
          RELEASE_SHA: ${{ github.sha }}
          # The seeded accounts' staging password; without it the flows that
          # sign in for real are skipped there.
          E2E_PASSWORD: ${{ secrets.SEED_PASSWORD }}

  production:
    needs: [images, staging]
    runs-on: ubuntu-latest
    # No approval: production follows a green staging run. Production
    # releases run one at a time, in commit order, and a deploy already
    # running is never cancelled: a newer commit that passes staging waits
    # for it, and of several waiting only the latest runs next.
    environment: production
    concurrency:
      group: release-production
      cancel-in-progress: false
    env:
      IMAGE_WEB: ghcr.io/${{ github.repository }}-web@${{ needs.images.outputs.web }}
      IMAGE_API: ghcr.io/${{ github.repository }}-api@${{ needs.images.outputs.api }}
      IMAGE_WORKER: ghcr.io/${{ github.repository }}-worker@${{ needs.images.outputs.worker }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_SERVICE_WEB: ${{ vars.RAILWAY_SERVICE_WEB }}
      RAILWAY_SERVICE_API: ${{ vars.RAILWAY_SERVICE_API }}
      RAILWAY_SERVICE_WORKER: ${{ vars.RAILWAY_SERVICE_WORKER }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Deploy the staging-proven digests and wait for /health/ready
        # exec: the runner's cancel signals reach node, not a waiting shell.
        run: exec node scripts/railway-deploy.ts production
