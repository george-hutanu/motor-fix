name: Mutation

# Kept out of pull-request CI and off developer machines: a full run is too
# heavy for either. Runs every 3 days and on demand, one job per project, or
# per shard of a project split in scripts/mutation-shards.json, then a
# summary job that holds each project's combined score to its floor.
on:
  schedule:
    - cron: '0 2 */3 * *'
  workflow_dispatch:
    inputs:
      projects:
        description: Comma-separated Nx projects (empty runs every project)
        required: false
        default: ''
      shards:
        description: Comma-separated project:shard pairs, e.g. domain:auth-core,domain:rest (empty runs every shard)
        required: false
        default: ''
      full:
        description: Test every mutant again, ignoring the results of earlier runs
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Plan one job per project or shard
        id: plan
        env:
          PROJECTS: ${{ inputs.projects }}
          SHARDS: ${{ inputs.shards }}
        run: node scripts/mutation-plan.ts

  mutate:
    needs: plan
    name: mutate ${{ matrix.id }}
    runs-on: ubuntu-latest
    # Each entry's own limit, from scripts/mutation-shards.json, where it sits
    # beside the measured run it comes from.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      # PR CI holds up to 7 of the free plan's 20 concurrent runners per PR;
      # 5 mutation jobs leave room for one PR and a second beside it.
      max-parallel: 5
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: valkey/valkey:9
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
      AUTH_TOKEN_SECRET: ci-only-test-secret-not-used-in-any-deploy
      TZ: UTC
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Service containers take no command, so the slow-statement view is
      # preloaded here, as in CI: the data-store specs read it.
      - name: Preload pg_stat_statements
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -c "ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements'"
          docker restart ${{ job.services.postgres.id }}
          for i in $(seq 1 30); do
            docker exec ${{ job.services.postgres.id }} pg_isready -U postgres && break
            sleep 1
          done
          docker exec ${{ job.services.postgres.id }} pg_isready -U postgres
      - name: Migrate the test database
        run: npx prisma migrate deploy --config libs/domain/prisma.config.ts
      # Keys end in / so mcp's never restores mcp-tools' results.
      - name: Restore the mutation results of earlier runs
        if: ${{ !inputs.full }}
        uses: actions/cache/restore@v6
        with:
          path: reports/mutation
          key: mutation/${{ matrix.id }}/${{ github.ref_name }}/${{ github.run_id }}
          restore-keys: |
            mutation/${{ matrix.id }}/${{ github.ref_name }}/
            mutation/${{ matrix.id }}/
      # Through npx, which applies .npmrc's --experimental-vm-modules: Jest
      # cannot load the ESM-only Angular and Nest packages without it.
      # Streamed, so a job cancelled at its limit still shows Stryker's progress.
      - name: Mutation score
        id: mutation
        env:
          PROJECT: ${{ matrix.project }}
          SHARD: ${{ matrix.shard }}
          INCREMENTAL: ${{ inputs.full && 'false' || 'true' }}
        run: npx nx run "$PROJECT:test:mutation" --output-style=stream -- --incremental=$INCREMENTAL ${SHARD:+--shard=$SHARD}
      # Saved even when the step fails, so the next run resumes instead of starting over.
      - name: Save the mutation results
        if: always() && steps.mutation.outcome != 'skipped'
        uses: actions/cache/save@v6
        with:
          path: reports/mutation
          key: mutation/${{ matrix.id }}/${{ github.ref_name }}/${{ github.run_id }}
      - name: Upload the report
        if: always() && steps.mutation.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: mutation-${{ matrix.id }}
          path: reports/mutation
          if-no-files-found: ignore

  summary:
    needs: [plan, mutate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Download every job's report
        uses: actions/download-artifact@v7
        with:
          pattern: mutation-*
          path: reports/mutation-all
      - name: Combined score per project
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
          RESULT: ${{ needs.mutate.result }}
        run: node scripts/mutation-summary.ts reports/mutation-all
