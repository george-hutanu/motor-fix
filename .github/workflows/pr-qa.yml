name: PR QA

# The PR tester's mechanical half on a GitHub runner instead of the owner's
# 16 GB laptop: boot the PR head with PostgreSQL+PostGIS, Redis and MinIO,
# check /health/live and /health/ready, call the changed endpoints, run the viewport sweep
# (desktop, tablet, 390 and 320 px phones x light/dark x ro/en), the agent's
# flows, and upload the report and the screenshots. The unit and end-to-end
# suites are CI's (ci.yml runs them on the merge result), not run again here.
# It is .claude/scripts/pr-test/run.mjs in --tree mode, not a copy of it.
#
# It starts by itself when a same-repository PR is marked ready, pushed to or
# reopened (pull_request), and by hand from .claude/scripts/pr-test/dispatch.mjs
# (workflow_dispatch, which carries the agent's flows). A cloud session cannot
# dispatch, so it finds the pull_request run for its head over REST instead.
# The run sets the agent-review status on the head it tested, with its own
# GITHUB_TOKEN: pending at the start, success only when the run passed with no
# blocking findings, failure otherwise. The pr-tester agent still reads the
# report and posts the review and the PR description's Agent review section;
# on the laptop its own verdict, posted after the run, is the newer status.
on:
  pull_request:
    types: [ready_for_review, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true
        type: string
      sha:
        description: The PR head commit to test, 40 hex characters; the run refuses any other
        required: true
        type: string
      lap:
        description: Fix-and-retest lap
        required: false
        default: '1'
        type: string
      routes:
        description: Comma-separated routes for the viewport sweep
        required: false
        default: /,/cockpit
        type: string
      flows:
        description: The tester agent's flows file, gzipped then base64 (dispatch.mjs), or empty
        required: false
        default: ''
        type: string
      nonce:
        description: Lets the dispatcher find this run by its name
        required: false
        default: ''
        type: string

# Quoted: unquoted, YAML reads ` #` as a comment and every run is titled "PR QA".
# On pull_request the inputs are empty, so each falls back to the event's value.
run-name: "PR QA #${{ inputs.pr || github.event.pull_request.number }} at ${{ inputs.sha || github.event.pull_request.head.sha }} lap ${{ inputs.lap || '1' }} ${{ inputs.nonce }}"

permissions:
  contents: read
  statuses: write

# One run per PR: a newer head, or a lap dispatched after the run the push
# started, cancels the older one. A cancelled run writes no final status; the
# newer run sets pending on its own head.
concurrency:
  group: pr-qa-${{ inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qa:
    name: PR QA
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A draft is not ready for QA, and a fork's PR gets no write token.
    if: github.event_name == 'workflow_dispatch' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)
    env:
      PR: ${{ inputs.pr || github.event.pull_request.number }}
      SHA: ${{ inputs.sha || github.event.pull_request.head.sha }}
      LAP: ${{ inputs.lap || '1' }}
      ROUTES: ${{ inputs.routes || '/,/cockpit' }}
      FLOWS: ${{ inputs.flows }}
      # The runner is the slot: run.mjs does not queue on scripts/heavy.sh here.
      HEAVY_HELD: '1'
      TZ: UTC
    steps:
      - name: The inputs are a PR number, a full commit SHA, a lap and plain routes
        id: inputs
        run: |
          [[ "$PR" =~ ^[1-9][0-9]*$ ]] || { echo "::error::pr must be a PR number"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be the full 40-character head commit"; exit 1; }
          [[ "$LAP" =~ ^[1-9][0-9]*$ ]] || { echo "::error::lap must be a positive number"; exit 1; }
          [[ "$ROUTES" =~ ^/[A-Za-z0-9/_.,@:-]*$ ]] || { echo "::error::routes must be comma-separated paths, each path[@role][:status]"; exit 1; }

      - name: agent-review pending on the head under test
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api -X POST "repos/$REPO/statuses/$SHA" -f state=pending -f context=agent-review \
            -f description="PR QA lap $LAP running" -f target_url="$RUN_URL" > /dev/null

      # The tester comes from the ref this run was dispatched on (main), or
      # the PR's base branch on pull_request, so a PR branched before a tester
      # change is tested by today's tester and never by its own.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || '' }}
          path: tester
          sparse-checkout: .claude/scripts
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: The checkout is the commit asked for
        run: test "$(git -C pr rev-parse HEAD)" = "$SHA"

      # The PR's own docker-compose.yml, as a --local run uses: a PR that
      # changes the stack (an image, a service) is tested on it, and no image
      # is pinned here a second time. Its default ports are the ones run.mjs
      # --tree gives the apps (services.mjs EXTERNAL_PORTS), and so are its
      # credentials and bucket. The job's end removes the containers.
      - name: Start PostgreSQL, Redis and MinIO from the PR's compose file, and the bucket
        run: |
          docker compose -p pr-qa -f pr/docker-compose.yml up -d --wait postgres redis minio
          for _ in $(seq 1 60); do docker compose -p pr-qa -f pr/docker-compose.yml exec -T postgres pg_isready -U motorfix && break; sleep 1; done
          docker compose -p pr-qa -f pr/docker-compose.yml exec -T postgres pg_isready -U motorfix || { echo "::error::PostgreSQL did not accept connections within 60 s"; exit 1; }
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
          curl -fsS http://127.0.0.1:9000/minio/health/live || { echo "::error::MinIO was not healthy within 60 s"; exit 1; }
          # minio-setup retries its alias until MinIO answers; bound it.
          timeout 120 docker compose -p pr-qa -f pr/docker-compose.yml run --rm minio-setup

      - uses: actions/setup-node@v7
        with:
          node-version-file: pr/.nvmrc
          cache: npm
          cache-dependency-path: pr/package-lock.json

      - name: Install
        working-directory: pr
        run: npm ci

      - id: playwright
        working-directory: pr
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: pr
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: pr
        run: npx playwright install-deps chromium

      - name: Decode the flows
        if: inputs.flows != ''
        run: printf '%s' "$FLOWS" | base64 -d | gunzip > "$RUNNER_TEMP/flows.mjs"

      - name: Boot, readiness, API, sweep, flows
        id: run
        run: |
          args=()
          [ -n "$FLOWS" ] && args+=(--flows "$RUNNER_TEMP/flows.mjs")
          set +e
          node tester/.claude/scripts/pr-test/run.mjs "$PR" --tree pr --sha "$SHA" \
            --routes "$ROUTES" --lap "$LAP" --out "$RUNNER_TEMP/pr-qa" "${args[@]}"
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Readiness of the api and the worker
        if: always()
        run: grep -h 'ready ' "$RUNNER_TEMP/pr-qa/run.log" || echo "no readiness line in run.log"

      # Screenshots stay here, never in git: the agent copies only report.md
      # and report.json into specs/<feature>/pr-review/.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-qa-${{ inputs.pr || github.event.pull_request.number }}
          path: ${{ runner.temp }}/pr-qa
          retention-days: 7
          if-no-files-found: error

      - name: The verdict (1 means blocking findings; the report says which)
        env:
          CODE: ${{ steps.run.outputs.code }}
        run: exit "${CODE:-1}"

      # Not on cancel: a newer run on this PR owns the status then.
      - name: agent-review success or failure on the head under test
        if: ${{ !cancelled() && steps.inputs.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATE: ${{ job.status == 'success' && steps.run.outputs.code == '0' && 'success' || 'failure' }}
        run: |
          if [ "$STATE" = success ]; then desc="PR QA lap $LAP passed"; else desc="PR QA lap $LAP: blocking findings or a failed step"; fi
          gh api -X POST "repos/$REPO/statuses/$SHA" -f state="$STATE" -f context=agent-review \
            -f description="$desc" -f target_url="$RUN_URL" > /dev/null
