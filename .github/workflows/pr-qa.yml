name: PR QA

# The PR tester's mechanical half on a GitHub runner instead of the owner's
# 16 GB laptop: boot the PR head with PostgreSQL+PostGIS, Redis and MinIO,
# check /health/live and /health/ready, call the changed endpoints, run the viewport sweep
# (desktop, tablet, 390 and 320 px phones x light/dark x ro/en), the agent's
# flows, and upload the report and the screenshots. The unit and end-to-end
# suites are CI's (ci.yml runs them on the merge result), not run again here.
# It is .claude/scripts/pr-test/run.mjs in --tree mode, not a copy of it.
#
# Dispatched by .claude/scripts/pr-test/dispatch.mjs (the pr-tester agent),
# which waits for the run and downloads the artifact. The review, the
# agent-review status and the PR description's Agent review section are posted
# by that agent from the report: this workflow holds no secret and writes
# nothing to the repository or the PR.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true
        type: string
      sha:
        description: The PR head commit to test, 40 hex characters; the run refuses any other
        required: true
        type: string
      lap:
        description: Fix-and-retest lap
        required: false
        default: '1'
        type: string
      routes:
        description: Comma-separated routes for the viewport sweep
        required: false
        default: /,/cockpit
        type: string
      flows:
        description: The tester agent's flows file, gzipped then base64 (dispatch.mjs), or empty
        required: false
        default: ''
        type: string
      nonce:
        description: Lets the dispatcher find this run by its name
        required: false
        default: ''
        type: string

# Quoted: unquoted, YAML reads ` #` as a comment and every run is titled "PR QA".
run-name: 'PR QA #${{ inputs.pr }} at ${{ inputs.sha }} lap ${{ inputs.lap }} ${{ inputs.nonce }}'

permissions:
  contents: read

# No concurrency group: every run is a lap a dispatch.mjs is waiting on, and a
# group would cancel a running or pending one (GitHub keeps one pending per
# group) and turn that agent's lap into a run with no verdict. A run on an
# older head only costs runner minutes; the agent reads the report for its SHA.

jobs:
  qa:
    name: PR QA
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PR: ${{ inputs.pr }}
      SHA: ${{ inputs.sha }}
      LAP: ${{ inputs.lap }}
      ROUTES: ${{ inputs.routes }}
      FLOWS: ${{ inputs.flows }}
      # The runner is the slot: run.mjs does not queue on scripts/heavy.sh here.
      HEAVY_HELD: '1'
      TZ: UTC
    steps:
      - name: The inputs are a PR number, a full commit SHA, a lap and plain routes
        run: |
          [[ "$PR" =~ ^[1-9][0-9]*$ ]] || { echo "::error::pr must be a PR number"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be the full 40-character head commit"; exit 1; }
          [[ "$LAP" =~ ^[1-9][0-9]*$ ]] || { echo "::error::lap must be a positive number"; exit 1; }
          [[ "$ROUTES" =~ ^/[A-Za-z0-9/_.,@:-]*$ ]] || { echo "::error::routes must be comma-separated paths, each path[@role][:status]"; exit 1; }

      # The tester comes from the ref this run was dispatched on (main), so a
      # PR branched before a tester change is tested by today's tester.
      - uses: actions/checkout@v7
        with:
          path: tester
          sparse-checkout: .claude/scripts
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: The checkout is the commit asked for
        run: test "$(git -C pr rev-parse HEAD)" = "$SHA"

      # The PR's own docker-compose.yml, as a --local run uses: a PR that
      # changes the stack (an image, a service) is tested on it, and no image
      # is pinned here a second time. Its default ports are the ones run.mjs
      # --tree gives the apps (services.mjs EXTERNAL_PORTS), and so are its
      # credentials and bucket. The job's end removes the containers.
      - name: Start PostgreSQL, Redis and MinIO from the PR's compose file, and the bucket
        run: |
          docker compose -p pr-qa -f pr/docker-compose.yml up -d --wait postgres redis minio
          for _ in $(seq 1 60); do docker compose -p pr-qa -f pr/docker-compose.yml exec -T postgres pg_isready -U motorfix && break; sleep 1; done
          docker compose -p pr-qa -f pr/docker-compose.yml exec -T postgres pg_isready -U motorfix || { echo "::error::PostgreSQL did not accept connections within 60 s"; exit 1; }
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
          curl -fsS http://127.0.0.1:9000/minio/health/live || { echo "::error::MinIO was not healthy within 60 s"; exit 1; }
          # minio-setup retries its alias until MinIO answers; bound it.
          timeout 120 docker compose -p pr-qa -f pr/docker-compose.yml run --rm minio-setup

      - uses: actions/setup-node@v7
        with:
          node-version-file: pr/.nvmrc
          cache: npm
          cache-dependency-path: pr/package-lock.json

      - name: Install
        working-directory: pr
        run: npm ci

      - id: playwright
        working-directory: pr
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: pr
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: pr
        run: npx playwright install-deps chromium

      - name: Decode the flows
        if: inputs.flows != ''
        run: printf '%s' "$FLOWS" | base64 -d | gunzip > "$RUNNER_TEMP/flows.mjs"

      - name: Boot, readiness, API, sweep, flows
        id: run
        run: |
          args=()
          [ -n "$FLOWS" ] && args+=(--flows "$RUNNER_TEMP/flows.mjs")
          set +e
          node tester/.claude/scripts/pr-test/run.mjs "$PR" --tree pr --sha "$SHA" \
            --routes "$ROUTES" --lap "$LAP" --out "$RUNNER_TEMP/pr-qa" "${args[@]}"
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Readiness of the api and the worker
        if: always()
        run: grep -h 'ready ' "$RUNNER_TEMP/pr-qa/run.log" || echo "no readiness line in run.log"

      # Screenshots stay here, never in git: the agent copies only report.md
      # and report.json into specs/<feature>/pr-review/.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-qa-${{ inputs.pr }}
          path: ${{ runner.temp }}/pr-qa
          retention-days: 7
          if-no-files-found: error

      - name: The verdict (1 means blocking findings; the report says which)
        env:
          CODE: ${{ steps.run.outputs.code }}
        run: exit "${CODE:-1}"
