name: Grafana alerts

# Applies infra/observability/alerts/*.json to Grafana's MotorFix folder, one
# rule group per call, so Grafana holds exactly what the repository holds.
on:
  push:
    branches: [main]
    paths:
      - 'infra/observability/alerts/**'
      - '.github/workflows/grafana-alerts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grafana-alerts
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Only whether both are set; the token itself reaches the apply step
      # alone.
      GRAFANA: ${{ secrets.GRAFANA_SA_TOKEN != '' && vars.GRAFANA_URL != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Skip the alerts
        if: env.GRAFANA != 'true'
        env:
          NO_TOKEN: ${{ secrets.GRAFANA_SA_TOKEN == '' }}
          NO_URL: ${{ vars.GRAFANA_URL == '' }}
        run: |
          missing=""
          [ "$NO_TOKEN" = "true" ] && missing="GRAFANA_SA_TOKEN"
          [ "$NO_URL" = "true" ] && missing="${missing:+$missing and }GRAFANA_URL"
          echo "::notice::The alert rules are not applied: $missing not set."
      - name: Apply the alerts
        if: env.GRAFANA == 'true'
        env:
          GRAFANA_SA_TOKEN: ${{ secrets.GRAFANA_SA_TOKEN }}
          GRAFANA_URL: ${{ vars.GRAFANA_URL }}
        # Grafana's answers go to /dev/null, so a refusal logs only curl's
        # status line and never the request; each call gives up after a
        # minute. A refused group is named and the others are still applied.
        run: |
          auth="Authorization: Bearer ${GRAFANA_SA_TOKEN}"
          api="${GRAFANA_URL%/}/api"
          curl --fail -sS --max-time 60 "$api/folders/motorfix" -H "$auth" > /dev/null 2>&1 ||
            curl --fail-with-body -sS --max-time 60 -X POST "$api/folders" -H "$auth" -H 'Content-Type: application/json' --data '{"uid":"motorfix","title":"MotorFix"}' > /dev/null
          failed=0
          for f in infra/observability/alerts/*.json; do
            while read -r body; do
              group=$(jq -r .title <<< "$body")
              if curl --fail-with-body -sS --max-time 60 -X PUT "$api/v1/provisioning/folder/motorfix/rule-groups/$group" -H "$auth" -H 'X-Disable-Provenance: true' -H 'Content-Type: application/json' --data-binary @- <<< "$body" > /dev/null; then
                echo "applied $f ($group)"
              else
                echo "::error::$f: Grafana refused group $group"
                failed=1
              fi
            done < <(jq -c '.groups[] | .name as $g | {title: $g, interval: (.interval | rtrimstr("m") | tonumber * 60), rules: [.rules[] | . + {folderUID: "motorfix", ruleGroup: $g, orgID: 1}]}' "$f")
          done
          exit "$failed"
