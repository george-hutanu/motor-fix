name: Reset staging

# Started by hand: empties the staging database, migrates it and seeds it.
# Staging's Postgres has no public address, so this runner never connects to
# it: scripts/reset-staging.sh runs inside the running staging api service over
# `railway ssh`, with that service's own private database address. The ids come
# from the GitHub staging environment, there is no input that could name
# another, and the script refuses any container that is not staging.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    # Never during a staging release, which redeploys the api this runs in.
    concurrency:
      group: release-staging
      cancel-in-progress: false
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: 8dd6e2d9-ee17-4935-b160-9282308d5ac7
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_SERVICE_API: ${{ vars.RAILWAY_SERVICE_API }}
      KEY_NAME: reset-staging-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Install the Railway CLI
        run: npm install --global @railway/cli@5.63.1
      # `railway ssh` signs in with a key registered to the token's workspace.
      - name: Register an SSH key for this run
        run: |
          mkdir -p -m 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -C "$KEY_NAME" -f ~/.ssh/id_ed25519
          railway ssh keys add --key ~/.ssh/id_ed25519.pub --name "$KEY_NAME"
      - name: Empty, migrate and seed inside the staging api
        env:
          # The seed refuses staging without it: the repository is public.
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
        # The password travels on stdin, base64 so no quoting can break it, and
        # its encoded form is masked too. It is never an argument.
        run: |
          if [ -z "$SEED_PASSWORD" ]; then
            echo 'The staging environment has no SEED_PASSWORD secret.' >&2
            exit 1
          fi
          encoded=$(printf %s "$SEED_PASSWORD" | base64 -w0)
          echo "::add-mask::$encoded"
          {
            printf 'SEED_PASSWORD=$(printf %%s %s | base64 -d)\n' "$encoded"
            printf 'export SEED_PASSWORD\n'
            cat scripts/reset-staging.sh
          } | railway ssh --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --service "$RAILWAY_SERVICE_API" -- sh -s
      - name: Remove the SSH key
        if: always()
        # By its name, unique to this run; nothing to remove if none was made.
        run: |
          [ -f ~/.ssh/id_ed25519.pub ] || exit 0
          railway ssh keys remove "$KEY_NAME"
