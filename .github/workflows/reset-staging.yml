name: Reset staging

# Started by hand: empties the staging database, migrates it and seeds it.
# Staging's Postgres has no public address, so this runner never connects to
# it: a short-lived Railway sandbox on staging's private network
# (scripts/railway-sandbox.ts) runs scripts/reset-staging.sh in the staging
# api's current image, with the api's own private database address as a
# Railway reference, and is closed however the job ends. The ids come
# from the GitHub staging environment, there is no input that could name
# another, and the script refuses any container that is not staging.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    # Its own group: sharing release-staging would let a waiting reset cancel
    # a waiting release, since a group keeps only one pending run.
    concurrency:
      group: reset-staging
      cancel-in-progress: false
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: 8dd6e2d9-ee17-4935-b160-9282308d5ac7
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_SERVICE_API: ${{ vars.RAILWAY_SERVICE_API }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install the Railway CLI
        run: npm install --global @railway/cli@5.64.2
      - name: Mask the secrets
        env:
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
        run: node scripts/railway-sandbox.ts mask SEED_PASSWORD
      - name: Open a sandbox on the private network
        id: sandbox
        run: node scripts/railway-sandbox.ts open staging api
      - name: Empty, migrate and seed in the staging api image
        env:
          SANDBOX_ID: ${{ steps.sandbox.outputs.id }}
          # The seed refuses staging without it: the repository is public.
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
        # The password travels on stdin, base64 so no quoting can break it,
        # and both its forms are masked. It is never an argument. The api
        # image's entrypoint is skipped: the script is the whole command.
        run: |
          if [ -z "$SEED_PASSWORD" ]; then
            echo 'The staging environment has no SEED_PASSWORD secret.' >&2
            exit 1
          fi
          image=$(node scripts/railway-sandbox.ts image "$RAILWAY_SERVICE_API")
          {
            node scripts/railway-sandbox.ts prelude SEED_PASSWORD
            printf 'docker pull -q %s >&2\n' "$image"
            printf 'docker run --rm -i --network host --entrypoint sh -e DATABASE_URL -e APP_ENV -e RAILWAY_ENVIRONMENT_NAME -e SEED_PASSWORD %s -s <<'"'"'RESET'"'"'\n' "$image"
            cat scripts/reset-staging.sh
            printf 'RESET\n'
          } | node scripts/railway-sandbox.ts exec "$SANDBOX_ID"
      - name: Close the sandbox
        if: always() && steps.sandbox.outputs.id != ''
        env:
          SANDBOX_ID: ${{ steps.sandbox.outputs.id }}
        run: node scripts/railway-sandbox.ts close "$SANDBOX_ID"
