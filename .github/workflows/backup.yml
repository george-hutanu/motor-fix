name: Backup

# Every night at 03:00 UTC, and by hand: one encrypted copy of each
# environment's database in the backup bucket, kept 30 days. The database has
# no public address, so the job opens a short-lived Railway sandbox on the
# environment's private network (scripts/railway-sandbox.ts), where
# scripts/backup/dump.sh runs in the PostgreSQL service's own image and
# refuses any database that is not the environment this job names; the dump
# is encrypted and uploaded from the sandbox, and the sandbox is closed
# however the job ends. The production leg exists only while the
# repository variable PRODUCTION_ENABLED is true (the owner sets it): a leg
# bound to the production environment would wait for its reviewer before its
# first step, so while it is off only staging runs, and notes the skip. Inside
# a leg, an environment whose GitHub environment has no
# RAILWAY_SERVICE_POSTGRES is skipped; one with the service but a missing
# bucket or passphrase setting fails. A failed run is the backup alert: GitHub
# e-mails the owner.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(vars.PRODUCTION_ENABLED == 'true' && '["staging","production"]' || '["staging"]') }}
    concurrency:
      group: backup-${{ matrix.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ matrix.environment }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: 8dd6e2d9-ee17-4935-b160-9282308d5ac7
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_SERVICE_POSTGRES: ${{ vars.RAILWAY_SERVICE_POSTGRES }}
      BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
      BACKUP_S3_REGION: ${{ vars.BACKUP_S3_REGION }}
      BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
      BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Note that production is off
        if: matrix.environment == 'staging' && vars.PRODUCTION_ENABLED != 'true'
        run: |
          echo "::notice title=Production backup skipped::PRODUCTION_ENABLED is not true, so the production leg did not run tonight"
          echo "Production backup skipped: the repository variable PRODUCTION_ENABLED is not \`true\`." >> "$GITHUB_STEP_SUMMARY"
      - name: Check the settings
        id: settings
        run: node scripts/backup.ts settings >> "$GITHUB_OUTPUT"
      - name: Note the skip
        if: steps.settings.outputs.skip == 'true'
        run: echo "::notice title=Backup skipped::$ENVIRONMENT has no RAILWAY_SERVICE_POSTGRES, so no copy was taken"
      - name: Install the Railway CLI
        if: steps.settings.outputs.skip != 'true'
        run: npm install --global @railway/cli@5.64.2
      # Before anything could print them: the raw and base64 forms the
      # sandbox is handed on stdin.
      - name: Mask the secrets
        if: steps.settings.outputs.skip != 'true'
        run: node scripts/railway-sandbox.ts mask BACKUP_GPG_PASSPHRASE BACKUP_S3_ACCESS_KEY_ID BACKUP_S3_SECRET_ACCESS_KEY
      - name: Open a sandbox on the private network
        id: sandbox
        if: steps.settings.outputs.skip != 'true'
        run: node scripts/railway-sandbox.ts open "$ENVIRONMENT" postgres
      - name: Dump, encrypt, upload and prune
        if: steps.settings.outputs.skip != 'true'
        env:
          SANDBOX_ID: ${{ steps.sandbox.outputs.id }}
          AWS_ENDPOINT_URL: ${{ vars.BACKUP_S3_ENDPOINT }}
          AWS_REGION: ${{ vars.BACKUP_S3_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
        run: bash scripts/backup/backup.sh
      - name: Close the sandbox
        if: always() && steps.settings.outputs.skip != 'true' && steps.sandbox.outputs.id != ''
        env:
          SANDBOX_ID: ${{ steps.sandbox.outputs.id }}
        run: node scripts/railway-sandbox.ts close "$SANDBOX_ID"
