name: Point-in-time drill

# By hand, and on the first day of every quarter an hour after the dump drill:
# restores a write-ahead-log archive into a throwaway PostgreSQL on this runner
# to a chosen moment and proves it stopped there (scripts/backup/pitr-drill.sh).
# The self-contained job archives a database of its own to a store of its own,
# so it needs no setting; the staging job restores staging's archive and ends
# green with a notice until the staging environment has WAL_ARCHIVE_BUCKET.
# A pull request that changes the drill or the image runs the self-contained
# job only. The log ends with each step's seconds and the archive lag, the data
# at risk. A failed run is the alert: GitHub e-mails the owner.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 1 1,4,7,10 *'
  pull_request:
    paths:
      - 'infra/postgres/**'
      - 'scripts/backup/pitr-drill.sh'
      - '.github/workflows/pitr-drill.yml'

permissions:
  contents: read

jobs:
  self-contained:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A newer push to the same pull request replaces a drill still running.
    concurrency:
      group: pitr-drill-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # A pull request drills the image its own Dockerfile builds.
      - name: Build the image from this commit
        if: github.event_name == 'pull_request'
        run: docker build --pull -t ghcr.io/george-hutanu/motor-fix-postgres:18 infra/postgres
      - name: Pull the image
        if: github.event_name != 'pull_request'
        run: docker pull ghcr.io/george-hutanu/motor-fix-postgres:18
      - name: Archive, restore and check
        run: bash scripts/backup/pitr-drill.sh --self-contained

  staging:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 90
    concurrency:
      group: pitr-drill-staging
      cancel-in-progress: false
    env:
      WAL_ARCHIVE_BUCKET: ${{ vars.WAL_ARCHIVE_BUCKET }}
      WAL_ARCHIVE_ENDPOINT: ${{ vars.WAL_ARCHIVE_ENDPOINT }}
      WAL_ARCHIVE_REGION: ${{ vars.WAL_ARCHIVE_REGION }}
      WAL_ARCHIVE_KEY: ${{ secrets.WAL_ARCHIVE_KEY }}
      WAL_ARCHIVE_SECRET: ${{ secrets.WAL_ARCHIVE_SECRET }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: 8dd6e2d9-ee17-4935-b160-9282308d5ac7
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_SERVICE_POSTGRES: ${{ vars.RAILWAY_SERVICE_POSTGRES }}
    steps:
      - name: Check the settings
        id: settings
        run: |
          if [ -z "$WAL_ARCHIVE_BUCKET" ]; then echo skip=true; else echo skip=false; fi >> "$GITHUB_OUTPUT"
      - name: Note the skip
        if: steps.settings.outputs.skip == 'true'
        run: echo "::notice title=Point-in-time drill skipped::staging has no WAL_ARCHIVE_BUCKET, so its archive is not on yet"
      - uses: actions/checkout@v7
        if: steps.settings.outputs.skip != 'true'
      - uses: actions/setup-node@v7
        if: steps.settings.outputs.skip != 'true'
        with:
          node-version-file: .nvmrc
      - name: Install the Railway CLI
        if: steps.settings.outputs.skip != 'true'
        run: npm install --global @railway/cli@5.64.2
      # The markers are written as psql in a sandbox on staging's private
      # network: the database has no public address.
      - name: Open a sandbox on the private network
        id: sandbox
        if: steps.settings.outputs.skip != 'true'
        run: node scripts/railway-sandbox.ts open staging postgres
      - name: Pull the image
        if: steps.settings.outputs.skip != 'true'
        run: docker pull ghcr.io/george-hutanu/motor-fix-postgres:18
      - name: Mark, restore and check
        if: steps.settings.outputs.skip != 'true'
        env:
          SANDBOX_ID: ${{ steps.sandbox.outputs.id }}
        run: bash scripts/backup/pitr-drill.sh
      - name: Close the sandbox
        if: always() && steps.settings.outputs.skip != 'true' && steps.sandbox.outputs.id != ''
        env:
          SANDBOX_ID: ${{ steps.sandbox.outputs.id }}
        run: node scripts/railway-sandbox.ts close "$SANDBOX_ID"
