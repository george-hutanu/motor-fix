services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: motorfix
      POSTGRES_PASSWORD: motorfix
      POSTGRES_DB: motorfix
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
  redis:
    image: redis:7
    ports:
      - '${REDIS_PORT:-6379}:6379'
  minio:
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: motorfix
      MINIO_ROOT_PASSWORD: motorfix-secret
    ports:
      - '${MINIO_PORT:-9000}:9000'
  minio-setup:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >-
      sh -c "until mc alias set local http://minio:9000 motorfix motorfix-secret; do sleep 1; done
      && mc mb --ignore-existing local/motorfix"
