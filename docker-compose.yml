services:
  postgres:
    # Multi-arch build of the same PostGIS 17-3.5: postgis/postgis has no arm64
    # image, and emulating it on Apple silicon was slow and failed with
    # "exec format error". CI keeps postgis/postgis on its amd64 runners.
    image: imresamu/postgis:17-3.5
    # The worker's slow-statement reading needs the view preloaded.
    command: ['postgres', '-c', 'shared_preload_libraries=pg_stat_statements']
    environment:
      POSTGRES_USER: motorfix
      POSTGRES_PASSWORD: motorfix
      POSTGRES_DB: motorfix
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
  # Valkey, the BSD-licensed fork of Redis, under the old service name: the apps
  # reach it at REDIS_URL. noeviction: BullMQ's jobs are refused, never dropped.
  redis:
    image: valkey/valkey:9
    command: ['valkey-server', '--maxmemory-policy', 'noeviction']
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - '${REDIS_PORT:-6379}:6379'
  # SeaweedFS (Apache-2.0) as one process: master, volume, filer and S3 on
  # 8333. It creates the bucket as it starts, and its filer lists the bucket
  # only once it exists, so healthy means the bucket is ready.
  storage:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: mini -dir=/data -bucket=motorfix -admin.ui=false -webdav=false -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: motorfix
      AWS_SECRET_ACCESS_KEY: motorfix-secret
    ports:
      - '${STORAGE_PORT:-9000}:8333'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/healthz && wget -q -O /dev/null http://127.0.0.1:8888/buckets/motorfix/']
      start_period: 20s
      interval: 2s
      retries: 45
  # The AI assistants' identity server, for development and CI only:
  # `docker compose --profile assistants up -d --wait keycloak`. It reaches the
  # api and the test's client documents on the host as host.docker.internal.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    profiles: [assistants]
    command:
      - start-dev
      - --import-realm
      - --features=cimd,resource-indicators
      - --http-port=8081
      - --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      MCP_URL: ${MCP_URL:-http://127.0.0.1:3002/mcp}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:4200}
      API_INTERNAL_URL: http://host.docker.internal:3000
      ASSISTANT_TRUSTED_DOMAINS: ${ASSISTANT_TRUSTED_DOMAINS:-host.docker.internal}
      ASSISTANT_ALLOW_HTTP: 'true'
      ASSISTANT_BROKER_CLIENT_ID: ${ASSISTANT_BROKER_CLIENT_ID:-motorfix-broker}
      ASSISTANT_BROKER_CLIENT_SECRET: ${ASSISTANT_BROKER_CLIENT_SECRET:-local-only-broker-secret}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${KEYCLOAK_PORT:-8081}:8081'
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD-SHELL
        - exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3
      interval: 5s
      retries: 60
  # Local Grafana with Prometheus, Loki and Tempo behind one OTLP endpoint, for
  # development only: `docker compose --profile observability up -d otel-lgtm`.
  otel-lgtm:
    image: grafana/otel-lgtm:0.35.0
    profiles: [observability]
    ports:
      - '${GRAFANA_PORT:-3300}:3000'
      - '4317:4317'
      - '4318:4318'
